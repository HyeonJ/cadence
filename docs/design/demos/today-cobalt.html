// =====================================================
// Cool Cobalt design tokens
// =====================================================
const COBALT = '#2563EB';
const COBALT_DARK = '#1D4ED8';
const SKY = '#DBEAFE';
const SKY_DEEP = '#BFDBFE';
const INK = '#0A0A0A';
const INK_2 = '#262626';
const GRAY_500 = '#737373';
const GRAY_400 = '#A3A3A3';
const GRAY_300 = '#D4D4D4';
const HAIRLINE = '#E5E5E5';
const HAIRLINE_2 = '#DCE0E6';
const BASE = '#FAFAFA';

const FONT_NUM = "'Inter', -apple-system, sans-serif";
const FONT_BODY = "'Pretendard', 'Inter', -apple-system, sans-serif";

// =====================================================
// Shared atoms — Linear/Vercel style
// =====================================================
function Hairline({ vertical = false, style = {} }) {
  return (
    <div style={{
      background: HAIRLINE,
      ...(vertical ? { width: 1, alignSelf: 'stretch' } : { height: 1, width: '100%' }),
      ...style,
    }} />
  );
}

function Badge({ children, tone = 'sky' }) {
  const tones = {
    sky:    { bg: SKY,         color: COBALT_DARK, border: SKY_DEEP },
    ink:    { bg: '#F5F5F5',   color: INK,         border: HAIRLINE },
    cobalt: { bg: COBALT,      color: '#fff',      border: COBALT_DARK },
    ghost:  { bg: 'transparent', color: GRAY_500,  border: HAIRLINE },
  };
  const t = tones[tone] || tones.sky;
  return (
    <span style={{
      display: 'inline-flex',
      alignItems: 'center',
      gap: 6,
      padding: '3px 8px',
      fontSize: 11,
      fontWeight: 600,
      letterSpacing: '0.02em',
      color: t.color,
      background: t.bg,
      border: `1px solid ${t.border}`,
      borderRadius: 4,
      fontFamily: FONT_NUM,
      textTransform: 'uppercase',
    }}>{children}</span>
  );
}

function Checkbox({ checked = false }) {
  return (
    <div style={{
      width: 16,
      height: 16,
      borderRadius: 3,
      border: checked ? `1.5px solid ${COBALT}` : `1.5px solid ${GRAY_300}`,
      background: checked ? COBALT : '#fff',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      flexShrink: 0,
    }}>
      {checked && (
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M2 5.2L4 7.2L8.4 2.8" stroke="#fff" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      )}
    </div>
  );
}

// Tiny vector glyphs (no emoji, no SVG people)
function Glyph({ name, size = 14, color = INK_2 }) {
  const stroke = { stroke: color, strokeWidth: 1.5, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    book: <><path d="M3 4h6a3 3 0 013 3v9a2 2 0 00-2-2H3V4z" {...stroke} /><path d="M21 4h-6a3 3 0 00-3 3v9a2 2 0 012-2h7V4z" {...stroke} /></>,
    code: <><path d="M8 7l-5 5 5 5" {...stroke} /><path d="M16 7l5 5-5 5" {...stroke} /><path d="M14 4l-4 16" {...stroke} /></>,
    git: <><circle cx="6" cy="6" r="2" {...stroke} /><circle cx="6" cy="18" r="2" {...stroke} /><circle cx="18" cy="14" r="2" {...stroke} /><path d="M6 8v8M8 6h6a4 4 0 014 4" {...stroke} /></>,
    sun: <><circle cx="12" cy="12" r="4" {...stroke} /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" {...stroke} /></>,
    moon: <path d="M20 14a8 8 0 11-9.5-9.5A6 6 0 0020 14z" {...stroke} />,
    arrow: <><path d="M5 12h14" {...stroke} /><path d="M13 6l6 6-6 6" {...stroke} /></>,
    check: <path d="M4 12l5 5 11-11" {...stroke} />,
    dot: <circle cx="12" cy="12" r="3" fill={color} />,
    flag: <><path d="M5 4v17" {...stroke} /><path d="M5 5h12l-2 4 2 4H5" {...stroke} /></>,
    layers: <><path d="M12 3l9 5-9 5-9-5 9-5z" {...stroke} /><path d="M3 13l9 5 9-5" {...stroke} /></>,
    settings: <><circle cx="12" cy="12" r="3" {...stroke} /><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4.9a7 7 0 00-2-1.2L14 3h-4l-.5 2.5a7 7 0 00-2 1.2l-2.4-.9-2 3.4 2 1.6A7 7 0 005 12a7 7 0 00.1 1.2l-2 1.6 2 3.4 2.4-.9a7 7 0 002 1.2L10 21h4l.5-2.5a7 7 0 002-1.2l2.4.9 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z" {...stroke} /></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" style={{ flexShrink: 0, display: 'block' }}>
      {paths[name]}
    </svg>
  );
}

const DAY_HEADERS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

// 30-day sprint state. day index 0..29
// statuses: 'past' | 'today' | 'future'
// dayMeta: each day has { input, build, share } amounts (small dots).
function buildSprintDays() {
  const days = [];
  for (let i = 0; i < 30; i++) {
    let status = 'future';
    if (i < 2) status = 'past';
    else if (i === 2) status = 'today';
    days.push({ idx: i, status });
  }
  // sample past activity
  // d0: input 2 build 0 share 0
  // d1: input 2 build 0 share 0
  days[0].input = 2; days[0].build = 0; days[0].share = 0;
  days[1].input = 2; days[1].build = 0; days[1].share = 0;
  days[2].input = 0; days[2].build = 0; days[2].share = 0;
  return days;
}

function DayCell({ day, isMobile = false }) {
  const w = isMobile ? 'auto' : 'auto';

  }
  return (
    <div style={{ ...baseStyle, background: bg, ...(day.status === 'today' ? { boxShadow: `inset 0 0 0 1.5px ${COBALT}` } : {}) }}>

          {day.input > 0 && <div style={{ width: 4, height: 4, borderRadius: 99, background: COBALT }} />}

          {day.share > 0 && <div style={{ width: 4, height: 4, borderRadius: 99, background: SKY_DEEP }} />}
          {day.input === 0 && day.build === 0 && day.share === 0 && (
            <div style={{ fontFamily: FONT_NUM, fontSize: 9, color: GRAY_400 }}>—</div>
          )}
        </div>
      )}
      {day.status === 'today' && (
        <div style={{
