/* Sage leaf-shaped dot, inline SVG (as required) */
function LeafDot({ size = 12, color = SAGE, filled = false }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" style={{ flexShrink: 0 }}>
      <path
        d="M4 20 C 4 10, 12 4, 20 4 C 20 12, 14 20, 4 20 Z"
        fill={filled ? color : 'none'}
        stroke={color}
        strokeWidth="1.4"
        strokeLinejoin="round"
      />
      {filled && (
        <path d="M5 19 C 10 14, 14 10, 19 5" stroke="rgba(255,255,255,0.55)" strokeWidth="1" fill="none" strokeLinecap="round" />
      )}
    </svg>
  );
}

function CheckCircle({ checked = false, size = 18 }) {

      <circle cx="11" cy="11" r="9" fill={checked ? SAGE : 'none'} stroke={checked ? SAGE : INK_SOFT} strokeWidth="1.2" />
      {checked && <path d="M6.5 11.2 L 9.8 14.3 L 15.5 7.8" stroke="#F4F1EA" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round" />}
    </svg>
  );
}

/* Soft area chart — like a landscape */
function AreaChart({ width = 220, height = 64, points, color = SAGE, fill = SAGE_FADE, dashed = false }) {
  // points: array of y values 0..1
  const n = points.length;
  const stepX = width / (n - 1);
  const ys = points.map((p) => height - p * (height - 6) - 3);
  // Cardinal-ish smoothing via cubic
  let d = `M 0 ${ys[0].toFixed(2)}`;
  for (let i = 0; i < n - 1; i++) {
    const x0 = i * stepX;
    const x1 = (i + 1) * stepX;
    const cx = (x0 + x1) / 2;
    d += ` C ${cx.toFixed(2)} ${ys[i].toFixed(2)}, ${cx.toFixed(2)} ${ys[i + 1].toFixed(2)}, ${x1.toFixed(2)} ${ys[i + 1].toFixed(2)}`;
  }
  const fillD = d + ` L ${width} ${height} L 0 ${height} Z`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: 'block' }}>
      <path d={fillD} fill={fill} />
      <path d={d} fill="none" stroke={color} strokeWidth="1.4" strokeLinecap="round" strokeDasharray={dashed ? '3 4' : '0'} />
    </svg>
  );
}

/* Long horizon ink-wash curve, used as page divider */
function HorizonCurve({ width, color = INK, opacity = 0.18 }) {
  return (
    <svg width={width} height="14" viewBox={`0 0 ${width} 14`} style={{ display: 'block' }}>
      <path
        d={`M 0 9 C ${width * 0.25} 2, ${width * 0.5} 13, ${width * 0.75} 6 S ${width} 8, ${width} 8`}
        fill="none" stroke={color} strokeWidth="0.9" opacity={opacity} strokeLinecap="round"
      />
    </svg>
  );
}
