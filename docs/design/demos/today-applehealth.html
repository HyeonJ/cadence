/* =========================================================

   ========================================================= */

              <div style={iosFrameStyles.signalIcon}>
                <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
                <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
                <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
                <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />

/* =========================================================
   Activity Ring — 3중 (인풋 / 빌드 / 공유)
   ========================================================= */
function ActivityRing({ size = 220, strokeWidth = 18, gap = 6, values = [16, 0, 0], showCenter = true }) {
  // 외→내: input(blue), build(cyan), share(sky)
  const colors = ['#007AFF', '#38BDF8', '#7DD3FC'];
  const trackColors = ['rgba(0,122,255,0.12)', 'rgba(56,189,248,0.14)', 'rgba(125,211,252,0.18)'];
  const rings = [];
  let r = (size - strokeWidth) / 2;
  for (let i = 0; i < 3; i++) {
    const radius = r - i * (strokeWidth + gap);
    if (radius <= 0) break;
    const c = 2 * Math.PI * radius;
    const v = Math.max(0, Math.min(100, values[i] || 0));
    const dash = (v / 100) * c;
    rings.push({ radius, c, dash, color: colors[i], track: trackColors[i] });
  }
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <defs>
          <linearGradient id={`ringGrad0-${size}`} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#0EA5E9"/>
            <stop offset="50%" stopColor="#38BDF8"/>
            <stop offset="100%" stopColor="#7DD3FC"/>
          </linearGradient>
        </defs>
        {rings.map((ring, i) => (
          <g key={i}>
            <circle cx={size/2} cy={size/2} r={ring.radius}
              stroke={ring.track} strokeWidth={strokeWidth} fill="none" />
            <circle cx={size/2} cy={size/2} r={ring.radius}
              stroke={i === 0 ? `url(#ringGrad0-${size})` : ring.color}
              strokeWidth={strokeWidth}
              fill="none"
              strokeDasharray={`${ring.dash} ${ring.c}`}
              strokeLinecap="round"
            />
          </g>
        ))}
      </svg>
      {showCenter && (
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
        }}>
          <div className="num-en" style={{
            fontSize: size * 0.26, fontWeight: 800, color: '#1C1C1E', lineHeight: 1,
          }}>{Math.round(values[0])}<span style={{ fontSize: size * 0.13, fontWeight: 700, color: '#8E8E93' }}>%</span></div>
          <div style={{ fontSize: size * 0.06, color: '#8E8E93', fontWeight: 600, marginTop: 6 }}>Sprint 1 진행률</div>
        </div>
      )}
    </div>
  );
}

   ========================================================= */

      padding,
      boxShadow: '0 1px 3px rgba(0,0,0,0.04), 0 0 0 0.5px rgba(0,0,0,0.04)',
      ...style,

}

function Pill({ children, bg = '#007AFF', color = '#fff', icon = null }) {

}

      background: palette.bg, borderRadius: 12,
    }}>
      <div style={{ width: 8, height: 8, borderRadius: 4, background: palette.dot }} />
      <span style={{ fontSize: 12, color: palette.txt, fontWeight: 700 }}>{label}</span>
      <span className="num-en" style={{ marginLeft: 'auto', fontSize: 14, color: palette.txt, fontWeight: 800 }}>{value}</span>
    </div>
  );
}

function SlotCard({ icon, slotLabel, title, items, autoBadge = false, compact = false }) {
  return (
    <Card padding={compact ? 16 : 20} style={{ marginBottom: compact ? 12 : 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
        {icon}
        <div style={{ fontSize: 11.5, fontWeight: 800, color: '#8E8E93', letterSpacing: '0.06em' }}>{slotLabel}</div>
        {autoBadge && (
          <div style={{ marginLeft: 'auto' }}>
            <Pill bg="#007AFF" icon={<Icon.Bolt size={11} color="#fff"/>}>commit ≥ 1로 자동 완료</Pill>
          </div>
        )}
      </div>
      <div style={{
        fontSize: compact ? 16 : 18, fontWeight: 800, color: '#1C1C1E',
        letterSpacing: '-0.01em', marginBottom: 14,
      }}>{title}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {items.map((it, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <Checkbox checked={it.checked} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontSize: compact ? 14 : 15, fontWeight: 700, color: '#1C1C1E',
                textDecoration: it.checked ? 'none' : 'none',
                opacity: it.checked ? 0.55 : 1,
                marginBottom: 2,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              }}>{it.name}</div>
              <div style={{
                fontSize: 12, color: '#8E8E93', fontWeight: 500,
                fontFamily: it.mono ? 'ui-monospace, SFMono-Regular, Menlo, monospace' : 'inherit',
              }}>{it.meta}</div>
            </div>
            <div className="num-en" style={{ fontSize: 13, color: '#8E8E93', fontWeight: 700 }}>{it.time}</div>
          </div>
        ))}
      </div>
    </Card>
  );
}

/* =========================================================
   Sprint Progress screen
   ========================================================= */
function SprintProgressContent({ compact = false }) {
  const pad = compact ? 16 : 28;
  // 30일 캘린더 데이터 — Day 3까지 진행. (4주 = 28cells + 마지막 주 2cells)
  // 0: empty(미래), 1: input only, 2: input+build, 3: today, 4: rest
  const days = [];
  for (let i = 1; i <= 30; i++) {
    if (i === 3) days.push({ d: i, kind: 'today' });
    else if (i === 1) days.push({ d: i, kind: 'past', input: 1, build: 0 });
    else if (i === 2) days.push({ d: i, kind: 'past', input: 1, build: 0 });
    else days.push({ d: i, kind: 'future' });
  }

  return (
    <div style={{
      background: '#F2F2F7',
      minHeight: '100%',
      padding: pad,
      paddingTop: compact ? 12 : 28,
      fontFamily: 'inherit',
    }}>
      {/* Header */}
      <div style={{ marginBottom: compact ? 14 : 22 }}>
        <div style={{
          fontSize: compact ? 13 : 14, color: '#8E8E93', fontWeight: 700,
          letterSpacing: '0.02em', textTransform: 'uppercase',
          marginBottom: 4,
        }}>Sprint Progress</div>
        <div style={{
          fontSize: compact ? 22 : 30,
          fontWeight: 800, color: '#1C1C1E',
          letterSpacing: '-0.02em',
          marginBottom: 4,
        }}>Sprint 1 · Agent SDK + MCP</div>
        <div style={{ fontSize: compact ? 12.5 : 14, color: '#8E8E93', fontWeight: 600 }} className="num-en">
          2026-04-29 ~ 2026-05-28
        </div>
      </div>

      {/* Hero Activity Ring */}
      <Card padding={compact ? 18 : 28} style={{ marginBottom: compact ? 12 : 18 }}>
        <div style={{ display: 'flex', flexDirection: compact ? 'column' : 'row', alignItems: 'center', gap: compact ? 14 : 28 }}>
          <ActivityRing
            size={compact ? 220 : 280}
            strokeWidth={compact ? 22 : 28}
            gap={compact ? 5 : 7}
            values={[16, 0, 0]}
            showCenter={true}
          />
          <div style={{ flex: 1, alignSelf: 'stretch', display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 10, width: compact ? '100%' : 'auto' }}>
            <RingLegend color="#007AFF" name="인풋" desc="자료 정독" current={4} total={25} pct={16} />
            <RingLegend color="#38BDF8" name="빌드" desc="실제 작업" current={0} total={16} pct={0} />
            <RingLegend color="#7DD3FC" name="공유" desc="아웃풋" current={0} total={4} pct={0} />
          </div>
        </div>
      </Card>

      {/* Stat cards 3개 */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: compact ? 'repeat(3, 1fr)' : 'repeat(3, 1fr)',
        gap: compact ? 8 : 14,
        marginBottom: compact ? 14 : 18,
      }}>
        <StatCard color="#007AFF" name="인풋" current="4" total="25" pct="16%" compact={compact}/>
        <StatCard color="#38BDF8" name="빌드" current="0" total="16" pct="0%" compact={compact}/>
        <StatCard color="#7DD3FC" name="공유" current="0" total="4" pct="0%" compact={compact}/>
      </div>

      {/* Calendar */}
      <Card padding={compact ? 16 : 22}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <Icon.Calendar size={16} color="#1C1C1E"/>
            <span style={{ fontSize: 13, fontWeight: 800, color: '#1C1C1E', letterSpacing: '0.02em' }}>30일 캘린더</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <LegendDot color="#007AFF" label="오늘" />
            <LegendDot color="#7DD3FC" label="진행" />
            <LegendDot color="#E5E5EA" label="예정" />
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '40px 1fr', gap: compact ? 8 : 12 }}>
          {[1,2,3,4].map((wIdx) => {
            const start = (wIdx - 1) * 7;
            const weekDays = days.slice(start, Math.min(start + 7, 30));
            return (
              <React.Fragment key={wIdx}>
                <div style={{
                  display: 'flex', alignItems: 'center',
                  fontSize: 11, fontWeight: 800, color: '#8E8E93',
                  letterSpacing: '0.06em',
                }}>W{wIdx}</div>
                <div style={{
                  display: 'grid',
                  gridTemplateColumns: 'repeat(7, 1fr)',
                  gap: compact ? 6 : 10,
                }}>
                  {Array.from({ length: 7 }).map((_, di) => {
                    const day = weekDays[di];
                    if (!day) return <div key={di} />;
                    return <DayCell key={di} day={day} compact={compact} />;
                  })}
                </div>
              </React.Fragment>
            );
          })}
        </div>
      </Card>

      <div style={{ height: compact ? 12 : 24 }} />
    </div>
  );
}

function RingLegend({ color, name, desc, current, total, pct }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '10px 12px',
      background: '#F8F9FB', borderRadius: 14,
    }}>
      <div style={{ width: 12, height: 12, borderRadius: 6, background: color, flexShrink: 0 }}/>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: '#1C1C1E' }}>{name}</div>
        <div style={{ fontSize: 11.5, color: '#8E8E93', fontWeight: 600 }}>{desc}</div>
      </div>
      <div className="num-en" style={{ textAlign: 'right' }}>
        <div style={{ fontSize: 16, fontWeight: 800, color: '#1C1C1E', lineHeight: 1 }}>
          {current}<span style={{ color: '#8E8E93', fontWeight: 700 }}> / {total}</span>
        </div>
        <div style={{ fontSize: 11.5, fontWeight: 700, color, marginTop: 2 }}>{pct}%</div>
      </div>
    </div>
  );
}

function StatCard({ color, name, current, total, pct, compact }) {
  return (
    <Card padding={compact ? 12 : 18}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
        <div style={{ width: 8, height: 8, borderRadius: 4, background: color }} />
        <div style={{ fontSize: 11.5, fontWeight: 800, color: '#8E8E93', letterSpacing: '0.06em' }}>{name.toUpperCase()}</div>
      </div>
      <div className="num-en" style={{
        fontSize: compact ? 26 : 38, fontWeight: 800, color: '#1C1C1E', lineHeight: 1,
        letterSpacing: '-0.03em',
      }}>
        {current}<span style={{ color: '#C7C7CC', fontWeight: 700, fontSize: compact ? 18 : 24 }}> / {total}</span>
      </div>
      <div className="num-en" style={{
        marginTop: 6,
        fontSize: compact ? 12 : 14, fontWeight: 800,
        color,
      }}>{pct}</div>
    </Card>
  );
}

function LegendDot({ color, label }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
      <div style={{ width: 8, height: 8, borderRadius: 4, background: color }} />
      <span style={{ fontSize: 11, fontWeight: 700, color: '#8E8E93' }}>{label}</span>
    </div>
  );
}

function DayCell({ day, compact }) {
  let bg = '#E5E5EA';
  let color = '#8E8E93';
  let shadow = 'none';
  let extra = null;

  if (day.kind === 'today') {
    bg = '#007AFF';
    color = '#fff';
    shadow = '0 4px 12px rgba(0,122,255,0.35)';
    extra = <div style={{
      position: 'absolute', bottom: 4, left: '50%', transform: 'translateX(-50%)',
      width: 4, height: 4, borderRadius: 2, background: '#fff',
    }}/>;
  } else if (day.kind === 'past') {
    bg = '#7DD3FC';
    color = '#0C4A6E';
  }

  return (
    <div style={{
      position: 'relative',
      aspectRatio: '1 / 1',
      borderRadius: compact ? 8 : 11,
      background: bg,
      color,
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      fontSize: compact ? 11 : 13,
      fontWeight: 800,
      fontFamily: 'Inter, sans-serif',
      letterSpacing: '-0.01em',
      boxShadow: shadow,
    }}>
      {day.d}
      {extra}
    </div>
  );
}

/* =========================================================
   Page Layout
   ========================================================= */

      display: 'grid',
      gridTemplateColumns: '1fr 1fr',

      minHeight: '100vh',
    }}>

          <div style={{ width: 1440, height: 900, overflow: 'auto' }}>
            <DesktopShell active="sprint">
              <SprintProgressContent compact={false} />

        display: 'flex', flexDirection: 'column', gap: 4,

        <div style={{
          fontSize: 16, fontWeight: 800, color: '#1C1C1E', padding: '4px 12px 18px 12px',
          letterSpacing: '-0.02em',
          display: 'flex', alignItems: 'center', gap: 8,
        }}>
          <div style={{
            width: 24, height: 24, borderRadius: 7,

          Coach

        <NavItem icon={<Icon.Chart color={active === 'sprint' ? '#007AFF' : '#8E8E93'} />} label="Sprint Progress" active={active === 'sprint'} />
        <NavItem icon={<Icon.Book size={20} color="#8E8E93" />} label="History" />
        <NavItem icon={<Icon.Share size={20} color="#8E8E93" />} label="Share" />

        <div style={{ flex: 1 }}/>
        <div style={{
          background: '#F2F2F7',
          borderRadius: 12,
          padding: '12px 12px',

        }}>
          <div style={{
            width: 32, height: 32, borderRadius: 16,
            background: '#1C1C1E', color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 13, fontWeight: 800,
          }}>HJ</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: '#1C1C1E' }}>HyeonJ</div>
            <div style={{ fontSize: 11, color: '#8E8E93', fontWeight: 600 }}>Sprint 1 · Day 3</div>
          </div>

function NavItem({ icon, label, active = false }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 10,
      padding: '10px 12px',
      borderRadius: 10,
      background: active ? '#EAF4FF' : 'transparent',
      color: active ? '#007AFF' : '#1C1C1E',
      fontSize: 13.5, fontWeight: 700,
      cursor: 'pointer',
    }}>
      {icon}
      <span>{label}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
