/* ==================== Area chart — the centerpiece ==================== */
/* Generates smooth cubic-Bezier area paths from a series of values 0..1 */
function smoothPath(points){
  if (points.length < 2) return '';
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i=0; i<points.length-1; i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    const t = 0.22;
    const c1x = p1.x + (p2.x - p0.x) * t;
    const c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t;
    const c2y = p2.y - (p3.y - p1.y) * t;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}
function AreaLayer({ values, width, height, padX=20, baseY, fill, stroke, strokeWidth=1.2, fillOpacity=0.55 }){
  const innerW = width - padX*2;
  const stepX = innerW / (values.length - 1);
  const points = values.map((v,i)=>({
    x: padX + i*stepX,
    y: baseY - v * (baseY - 16),
  }));
  const linePath = smoothPath(points);
  const areaPath = `${linePath} L ${points[points.length-1].x} ${baseY} L ${points[0].x} ${baseY} Z`;
  return (
    <g>
      <path d={areaPath} fill={fill} opacity={fillOpacity} />
      <path d={linePath} fill="none" stroke={stroke} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
    </g>
  );
}

function SprintAreaChart({width=900, height=260}){
  // 30 days
  const N = 30;
  // input — front-loaded reading
  const inputVals = [0.55,0.62,0.70,0.66,0.58,0.50,0.45,0.42,0.40,0.38,0.36,0.34,0.32,0.30,0.28,0.26,0.24,0.22,0.20,0.18,0.16,0.15,0.14,0.13,0.12,0.11,0.10,0.09,0.08,0.07];
  // build — ramps mid-sprint
  const buildVals = [0.05,0.08,0.10,0.14,0.20,0.28,0.36,0.44,0.52,0.60,0.66,0.72,0.78,0.82,0.85,0.88,0.86,0.84,0.80,0.76,0.72,0.68,0.62,0.56,0.50,0.44,0.38,0.32,0.26,0.20];
  // share — late
  const shareVals = [0.00,0.00,0.00,0.00,0.02,0.04,0.05,0.06,0.08,0.10,0.12,0.14,0.16,0.18,0.20,0.22,0.26,0.30,0.36,0.42,0.50,0.58,0.66,0.72,0.78,0.82,0.86,0.88,0.90,0.92];

  const baseY = height - 36;

  // grid horizontal lines
  const gridY = [0.25, 0.5, 0.75].map(p => baseY - p*(baseY-16));

  // x-axis ticks for weeks
  const padX = 20;
  const innerW = width - padX*2;
  const stepX = innerW / (N - 1);

  const todayIndex = 2; // day 3

  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:'block'}}>
      <defs>
        <linearGradient id="indigoFadeA" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={INDIGO_DEEP} stopOpacity="0.55"/>
          <stop offset="100%" stopColor={INDIGO_DEEP} stopOpacity="0.05"/>
        </linearGradient>
        <linearGradient id="indigoFadeB" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={INDIGO_MID} stopOpacity="0.45"/>
          <stop offset="100%" stopColor={INDIGO_MID} stopOpacity="0.04"/>
        </linearGradient>
        <linearGradient id="indigoFadeC" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={INDIGO_LIGHT} stopOpacity="0.55"/>
          <stop offset="100%" stopColor={INDIGO_LIGHT} stopOpacity="0.02"/>
        </linearGradient>
      </defs>

      {/* horizontal hairlines */}
      {gridY.map((y,i)=>(
        <line key={i} x1={padX} x2={width-padX} y1={y} y2={y} stroke={RULE} strokeWidth="0.6" strokeDasharray="2 4"/>
      ))}
      <line x1={padX} x2={width-padX} y1={baseY} y2={baseY} stroke={INK_FAINT} strokeWidth="0.8" />

      {/* layers: input (deepest), build, share (lightest top) - but indigo agnomen of light/deep */}
      <AreaLayer values={inputVals} width={width} height={height} padX={padX} baseY={baseY}
        fill="url(#indigoFadeA)" stroke={INDIGO_DEEP} strokeWidth={1.1} fillOpacity={1}/>
      <AreaLayer values={buildVals} width={width} height={height} padX={padX} baseY={baseY}
        fill="url(#indigoFadeB)" stroke={INDIGO_MID} strokeWidth={1.1} fillOpacity={1}/>
      <AreaLayer values={shareVals} width={width} height={height} padX={padX} baseY={baseY}
        fill="url(#indigoFadeC)" stroke={INDIGO_LIGHT} strokeWidth={1.1} fillOpacity={1}/>

      {/* today marker — vertical hairline + grass dot */}
      <line x1={padX + todayIndex*stepX} x2={padX + todayIndex*stepX}
            y1={16} y2={baseY} stroke={INDIGO_DEEP} strokeWidth="0.8" strokeDasharray="3 3" opacity="0.6"/>
      <circle cx={padX + todayIndex*stepX} cy={baseY} r="3.5" fill={INDIGO_DEEP}/>
      <text x={padX + todayIndex*stepX + 8} y={baseY-6}
            fontFamily="'Cormorant Garamond', serif" fontStyle="italic"
            fontSize="12" fill={INDIGO_DEEP}>오늘 · 셋째 날</text>

      {/* week labels under axis */}
      {[0,7,14,21,28].map((d,i)=>(
        <text key={i}
              x={padX + d*stepX} y={baseY+18}
              textAnchor="middle"
              fontFamily="'Cormorant Garamond', serif"
              fontStyle="italic"
              fontSize="11" fill={INK_FAINT}>
          {`Day ${d+1}`}
        </text>
      ))}
    </svg>
  );
}

/* mini area chart for progress cards */
function MiniArea({values, width=200, height=46, color=INDIGO_DEEP, fillId}){
  const padX=4;
  const baseY = height - 4;
  const innerW = width - padX*2;
  const stepX = innerW / (values.length - 1);
  const points = values.map((v,i)=>({ x: padX + i*stepX, y: baseY - v * (baseY-6) }));
  const linePath = smoothPath(points);
  const areaPath = `${linePath} L ${points[points.length-1].x} ${baseY} L ${points[0].x} ${baseY} Z`;
  const id = `mini-${fillId}`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:'block'}}>
      <defs>
        <linearGradient id={id} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.45"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.03"/>
        </linearGradient>
      </defs>
      <path d={areaPath} fill={`url(#${id})`} />
      <path d={linePath} fill="none" stroke={color} strokeWidth="1" strokeLinecap="round"/>
    </svg>
  );
}

function Calendar({mobile}){
  // 30 days. today = day 3
  const today = 2;
  const cells = [];
  for (let i=0;i<28;i++){
    cells.push(i);
  }
  // we'll pad to 30 with extra two
  const allDays = [...Array(30).keys()];
  // group by week (4w + 2)
  const weeks = [];
  for (let w=0; w<5; w++){
    const start = w*7;
    const end = Math.min(start+7, 30);
    if (start < 30) weeks.push(allDays.slice(start, end));
  }

  return (
    <div style={{
      padding: mobile?'12px 14px':'14px 18px',
      border:`1px solid ${RULE}`,
      borderRadius: mobile?16:18,
      background:'rgba(255,255,255,0.5)',
    }}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:10}}>
        <div className="serif" style={{fontStyle:'italic', color:INK_FAINT, fontSize:12, letterSpacing:'0.12em'}}>
          THIRTY DAYS
        </div>
        <div className="serif" style={{fontStyle:'italic', color:INK_FAINT, fontSize:11}}>
          月 · 火 · 水 · 木 · 金 · 土 · 日
        </div>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap: mobile?6:8}}>
        {weeks.map((week, wi)=>(
          <div key={wi} style={{display:'flex', alignItems:'center', gap: mobile?6:10}}>
            <div className="serif" style={{
              width:34, fontSize: mobile?11:12, color:INK_FAINT,
              fontStyle:'italic', letterSpacing:'0.05em',
            }}>{`W${wi+1}`}</div>
            <div style={{
              display:'grid',
              gridTemplateColumns:'repeat(7, 1fr)',
              gap: mobile?5:8, flex:1,
            }}>
              {Array(7).fill(0).map((_, di)=>{
                const dayIdx = week[di];
                if (dayIdx === undefined){
                  return <div key={di}/>;
                }
                const isToday = dayIdx === today;
                const isPast = dayIdx < today;
                const isFuture = dayIdx > today;
                return (
                  <DayCell key={di} mobile={mobile} day={dayIdx+1} isToday={isToday} isPast={isPast} isFuture={isFuture}/>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function DayCell({mobile, day, isToday, isPast, isFuture}){
  const size = mobile ? 32 : 40;
  return (
    <div style={{
      height:size,
      borderRadius: mobile?10:12,
      border:`1px solid ${isToday ? INDIGO_DEEP : RULE}`,
      background: isToday ? '#FFF' : (isPast ? 'rgba(26,35,126,0.05)' : 'transparent'),
      display:'flex', alignItems:'center', justifyContent:'center',
      position:'relative',
      flexDirection:'column',
      gap:2,
    }}>
      <span className="serif" style={{
        fontSize: mobile?10:11, fontStyle:'italic',
        color: isFuture ? INK_FAINT : (isToday ? INDIGO_DEEP : INK_SOFT),
      }}>{day}</span>
      {isToday ? (
        <GrassDot size={mobile?9:11} color={INDIGO_DEEP}/>
      ) : isPast ? (
        <span style={{width:4, height:4, borderRadius:999, background: day%2===0 ? INDIGO_DEEP : INDIGO_MID, opacity:0.85}}/>
      ) : (
        <span style={{width:3, height:3, borderRadius:999, background:INK_FAINT, opacity:0.4}}/>
      )}
    </div>
  );
}
