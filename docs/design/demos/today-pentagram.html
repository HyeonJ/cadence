<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #F2F2F2;
    font-family: 'Pretendard', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #0A0A0A;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .page {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    padding: 64px;
    align-items: start;
    justify-items: center;
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .cell-label {
    font-style: italic;
    color: #666;
    font-size: 13px;
    letter-spacing: 0.02em;
    align-self: flex-start;
    font-family: 'Inter', sans-serif;
  }
  .cell-label strong {
    font-style: normal;
    font-weight: 700;
    color: #0A0A0A;
    margin-right: 8px;
  }
  /* selection */
  ::selection { background: #E63946; color: #fff; }
</style>

                <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />

/* =========================================================
   Tiny atoms (Pentagram-flavored)
   ========================================================= */
function Hairline({ color = PENTA.black, height = 1, style }) {
  return <div style={{ height, background: color, width: '100%', ...style }} />;
}

function Checkbox({ checked = false, size = 16 }) {
  return (
    <div style={{
      width: size, height: size,
      border: `1.5px solid ${PENTA.black}`,
      background: checked ? PENTA.black : 'transparent',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexShrink: 0,
    }}>
      {checked && (
        <svg width={size - 6} height={size - 6} viewBox="0 0 10 10" fill="none">
          <path d="M1 5 L4 8 L9 2" stroke="#fff" strokeWidth="1.6" strokeLinecap="square" />
        </svg>
      )}
    </div>
  );
}

function NumberMark({ n, color = PENTA.black, size = 11 }) {
  return (
    <span style={{
      fontFamily: PENTA.display,
      fontSize: size, fontWeight: 700,
      letterSpacing: '0.06em',
      color,
    }}>
      {String(n).padStart(2, '0')}
    </span>
  );
}

function DayCell({ d, kind, sliverRead = 0, sliverBuild = 0, sliverShare = 0, isToday = false }) {
  const cellStyle = {
    ...sprintProgressStyles.dayCell,
    ...(kind === 'past' ? sprintProgressStyles.dayCellPast : {}),
    ...(kind === 'future' ? sprintProgressStyles.dayCellFuture : {}),
    ...(isToday ? sprintProgressStyles.dayCellToday : {}),
  };
  const numStyle = {
    ...sprintProgressStyles.dayNumber,
    ...(kind === 'future' ? sprintProgressStyles.dayNumberFuture : {}),
    ...(isToday ? sprintProgressStyles.dayNumberToday : {}),
  };
  return (
    <div style={cellStyle}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <span style={numStyle}>D{String(d).padStart(2, '0')}</span>
        {isToday && <span style={{ width: 6, height: 6, background: PENTA.red }} />}
      </div>
      {kind !== 'future' && (
        <div style={sprintProgressStyles.sliverRow}>
          <div style={{ ...sprintProgressStyles.sliver, height: sliverRead ? `${sliverRead * 100}%` : '8%', ...(sliverRead ? {} : sprintProgressStyles.sliverEmpty) }} />
          <div style={{ ...sprintProgressStyles.sliver, height: sliverBuild ? `${sliverBuild * 100}%` : '8%', ...(sliverBuild ? sprintProgressStyles.sliverRed : sprintProgressStyles.sliverEmpty) }} />
          <div style={{ ...sprintProgressStyles.sliver, height: sliverShare ? `${sliverShare * 100}%` : '8%', ...(sliverShare ? {} : sprintProgressStyles.sliverEmpty) }} />
        </div>
      )}
    </div>
  );
}

function MobileCell({ d, kind, isToday }) {
  const style = {
    ...sprintMobileStyles.cellMobile,
    ...(kind === 'past' ? sprintMobileStyles.cellPast : {}),
    ...(isToday ? sprintMobileStyles.cellToday : {}),
    ...(d == null ? sprintMobileStyles.cellEmpty : {}),
  };
  if (d == null) return <div style={style} />;
  return (
    <div style={style}>
      {d}
      {kind === 'past' && (
        <div style={{ position: 'absolute', bottom: 2, left: '50%', transform: 'translateX(-50%)', width: 4, height: 4, background: PENTA.black }} />
      )}
      {isToday && (
        <div style={{ position: 'absolute', bottom: 2, left: '50%', transform: 'translateX(-50%)', width: 4, height: 4, background: PENTA.red }} />
      )}
    </div>
  );
}
